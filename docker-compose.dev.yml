version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder  # Use builder stage for hot reload
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/actualize?authSource=admin
      - JWT_SECRET=dev-secret-change-in-production
      - AUTH_SECRET=dev-auth-secret-change-in-production
      - AUTH_URL=http://localhost:3000
    command: npm run dev

  # Optional: Add MongoDB Express for database management
  mongo-express:
    image: mongo-express:latest
    container_name: actualize-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password123@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb
    networks:
      - actualize-network
